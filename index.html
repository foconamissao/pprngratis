<style>
  :root{
    --bg:#0b0b09;
    --bg-2:#141210;
    --card:#17150f;
    --line: rgba(230,220,190,0.16);
    --line-strong: rgba(230,220,190,0.30);
    --bone:#e8e0c8;
    --bone-dim:#b7ac8b;
    --brass:#b6903f;
    --brass-dim:#8a6c34;
    --olive:#5e7a4d;
    --olive-glow: rgba(94,122,77,0.18);
    --oxide:#9c3f34;
    --oxide-glow: rgba(156,63,52,0.18);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(182,144,63,0.06), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .display{ font-family:'Anton', sans-serif; letter-spacing:0.5px; }
  .mono-label{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:2px; }

  /* ---------- Header / Selo ---------- */
  header{
    width:100%;
    display:flex;
    justify-content:center;
    padding: 22px 16px 10px;
  }
  .brandbar{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .seal{ width:56px; height:56px; flex-shrink:0; border-radius:50%; object-fit:cover; display:block; box-shadow: 0 0 0 1px rgba(182,144,63,0.4); }
  .brandtext{ line-height:1.05; }
  .brandtext .line1{
    font-family:'Anton', sans-serif;
    font-size:19px;
    color:var(--bone);
    letter-spacing:1px;
  }
  .brandtext .line2{
    font-family:'Oswald', sans-serif;
    font-size:10.5px;
    color:var(--brass);
    letter-spacing:2.5px;
    text-transform:uppercase;
  }

  main{
    width:100%;
    max-width:520px;
    padding: 8px 16px 60px;
    flex:1;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 22px;
    position:relative;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 18px 40px rgba(0,0,0,0.45);
  }
  .card::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(230,220,190,0.06);
    pointer-events:none;
  }

  .eyebrow{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:11px;
    color: var(--brass);
    margin:0 0 6px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before, .eyebrow::after{
    content:""; flex:1; height:1px; background: var(--line-strong);
  }
  h1.title{
    font-family:'Anton', sans-serif;
    font-size: 28px;
    line-height:1.15;
    margin: 4px 0 10px;
    color: var(--bone);
  }
  p.lead{
    color: var(--bone-dim);
    font-size:14.5px;
    line-height:1.55;
    margin: 0 0 20px;
  }

  /* ---------- Form ---------- */
  label{
    display:block;
    font-family:'Oswald', sans-serif;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color: var(--bone-dim);
    margin: 16px 0 6px;
  }
  input[type=text], input[type=tel]{
    width:100%;
    background: #0f0e0b;
    border:1px solid var(--line-strong);
    color: var(--bone);
    padding: 12px 12px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    border-radius: var(--radius);
    outline:none;
  }
  input::placeholder{ color: #5f5a49; }
  input:focus{ border-color: var(--brass); box-shadow: 0 0 0 3px rgba(182,144,63,0.15); }
  .field-error{ color: var(--oxide); font-size:12px; margin-top:5px; display:none; }
  .field-error.show{ display:block; }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    border:none;
    cursor:pointer;
    text-decoration:none;
    box-sizing:border-box;
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:1.3px;
    font-size:14px;
    font-weight:600;
    padding: 15px 18px;
    border-radius: var(--radius);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{
    background: linear-gradient(180deg, #c39b45, var(--brass-dim));
    color:#141005;
    box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 10px 20px rgba(182,144,63,0.15);
    margin-top:22px;
  }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-whatsapp{
    background:#1e3d2c;
    color:#d9f2df;
    border:1px solid #2f5a3f;
  }
  .btn-whatsapp:hover{ filter:brightness(1.12); }
  .btn-ghost{
    background:transparent;
    color: var(--bone-dim);
    border:1px solid var(--line-strong);
    text-transform:none;
    letter-spacing:0.3px;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:500;
  }
  .btn-ghost:hover{ color:var(--bone); border-color: var(--bone-dim); }

  .fineprint{
    font-size:11.5px;
    color:#6b6551;
    text-align:center;
    margin-top:14px;
    line-height:1.5;
  }

  .attention-box{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background: rgba(182,144,63,0.10);
    border:1px solid var(--brass);
    border-left:4px solid var(--brass);
    border-radius: var(--radius);
    padding:16px;
    margin-top:16px;
  }
  .attention-icon{ font-size:20px; line-height:1.1; color:var(--brass); flex-shrink:0; }
  .attention-text{ font-size:14.5px; line-height:1.6; color:var(--bone); }
  .attention-text a{ color:var(--brass); font-weight:700; text-decoration:underline; }
  .attention-text a:hover{ color:#d4af5f; }

  /* ---------- Modal (janela de atenção) ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 9999;
    animation: overlayIn .15s ease-out;
  }
  @keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal-dialog{
    width:100%;
    max-width: 360px;
    background: #f1f1f1;
    border-radius: 6px;
    overflow:hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3), 0 20px 60px rgba(0,0,0,0.5);
    animation: dialogIn .18s ease-out;
    font-family:'Inter', sans-serif;
  }
  @keyframes dialogIn{
    from{ transform: scale(0.92) translateY(6px); opacity:0; }
    to{ transform: scale(1) translateY(0); opacity:1; }
  }
  .modal-titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    background: linear-gradient(180deg, #2b2a24, #1a1912);
    color: #e8e0c8;
    padding: 10px 14px;
    font-family:'Oswald', sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    border-bottom: 1px solid #b6903f;
  }
  .modal-titlebar-icon{ color:#e0b84a; font-size:15px; }
  .modal-body{
    background:#fafaf8;
    padding: 20px 18px;
    text-align:center;
  }
  .modal-text{
    color:#1c1b17;
    font-size:14.5px;
    line-height:1.55;
    margin: 0 0 18px;
  }
  .modal-text b{ color:#8a3b32; }
  .modal-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    box-sizing:border-box;
    background: linear-gradient(180deg, #c39b45, #8a6c34);
    color:#141005;
    text-decoration:none;
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
    font-size:13.5px;
    padding: 13px 14px;
    border-radius: 4px;
    border: 1px solid #6e551f;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .modal-btn:hover{ filter:brightness(1.06); }

  /* ---------- Progress ---------- */
  .progress-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 16px;
  }
  .progress-row .pnum{ font-family:'Anton', sans-serif; color:var(--brass); font-size:13px; letter-spacing:1px; }
  .progress-track{ height:4px; background:#231f16; border-radius:2px; overflow:hidden; margin-bottom:20px; }
  .progress-fill{ height:100%; background: var(--brass); transition: width .3s ease; }

  .qtext{
    font-family:'Oswald', sans-serif;
    font-size: 16.5px;
    font-weight:500;
    line-height:1.5;
    color: var(--bone);
    margin-bottom: 18px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    width:100%;
    text-align:left;
    background:#0f0e0b;
    border:1px solid var(--line-strong);
    color: var(--bone);
    padding: 13px 14px;
    border-radius: var(--radius);
    margin-bottom:10px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  .opt:hover{ border-color: var(--brass-dim); }
  .opt .letter{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    color: var(--brass);
    border:1px solid var(--brass-dim);
    width:24px; height:24px; min-width:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
  }
  .opt.correct{ border-color: var(--olive); background: var(--olive-glow); }
  .opt.correct .letter{ border-color: var(--olive); color:#bfe0ac; }
  .opt.wrong{ border-color: var(--oxide); background: var(--oxide-glow); }
  .opt.wrong .letter{ border-color: var(--oxide); color:#f0b3ac; }
  .opt.disabled{ cursor:default; }
  .opt.dim{ opacity:0.45; }

  .comment-box{
    border-left:3px solid var(--brass);
    background: rgba(182,144,63,0.06);
    padding: 13px 14px;
    margin-top: 6px;
    font-size:13.5px;
    line-height:1.55;
    color: var(--bone-dim);
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  .comment-box b{ color: var(--bone); }

  .stamp{
    position:absolute;
    top: 14px; right: 14px;
    font-family:'Anton', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 5px 10px;
    border: 2px solid;
    border-radius: 2px;
    transform: rotate(-6deg);
    animation: stampin .28s ease-out;
  }
  .stamp.ok{ color:#bfe0ac; border-color:#bfe0ac; }
  .stamp.no{ color:#f0b3ac; border-color:#f0b3ac; }
  @keyframes stampin{
    0%{ transform: rotate(-6deg) scale(2.2); opacity:0; }
    60%{ transform: rotate(-6deg) scale(0.92); opacity:1; }
    100%{ transform: rotate(-6deg) scale(1); opacity:1; }
  }

  /* ---------- Result ---------- */
  .score-wrap{ display:flex; flex-direction:column; align-items:center; margin: 6px 0 22px; }
  .score-ring{
    width:132px; height:132px;
    border-radius:50%;
    border: 3px solid var(--brass);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle, rgba(182,144,63,0.08), transparent 70%);
  }
  .score-ring .big{ font-family:'Anton', sans-serif; font-size:34px; color:var(--bone); }
  .score-ring .small{ font-family:'Oswald', sans-serif; font-size:10px; letter-spacing:2px; color:var(--bone-dim); text-transform:uppercase; }

  .divider{ height:1px; background:var(--line); margin:22px 0; }
  .breakdown{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
  .breakdown-row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--bone-dim); }
  .breakdown-row b{ color:var(--bone); }
  .breakdown-bar{ flex:1; height:6px; background:#231f16; border-radius:3px; margin:0 10px; overflow:hidden; }
  .breakdown-fill{ height:100%; background:var(--brass); }

  .insta-row{
    display:flex; align-items:center; gap:10px;
    background:#0f0e0b; border:1px solid var(--line-strong);
    border-radius:var(--radius); padding:12px 14px; margin-top:14px;
  }
  .insta-row .handle{ font-family:'Oswald', sans-serif; color:var(--brass); font-weight:600; }

  .star-row{
    display:flex;
    justify-content:center;
    gap:6px;
    margin: 4px 0 4px;
  }
  .star-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:34px;
    line-height:1;
    color:#3a3527;
    padding:2px 4px;
    transition: transform .1s ease, color .15s ease;
  }
  .star-btn:hover{ transform: scale(1.12); color:#8a6c34; }
  .star-btn.filled{ color: var(--brass); }

  .folder-list{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .folder-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:left;
    background: linear-gradient(180deg, #1b1912, #141210);
    border:1px solid var(--line-strong);
    border-left:4px solid var(--brass);
    border-radius: var(--radius);
    padding:16px 14px;
    cursor:pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .folder-card:hover{ transform: translateX(2px); border-color: var(--brass); }
  .folder-icon{ font-size:26px; flex-shrink:0; }
  .folder-text{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .folder-title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:15.5px; color:var(--bone); text-transform:uppercase; letter-spacing:0.5px; }
  .folder-subtitle{ font-size:12.5px; color:var(--bone-dim); line-height:1.4; }
  .folder-arrow{ font-size:22px; color:var(--brass); flex-shrink:0; }

  footer{ padding: 10px 16px 40px; text-align:center; color:#5a5544; font-size:11.5px; }

  @media (max-width:400px){
    h1.title{ font-size:24px; }
  }
</style>
</head>

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledQuiz(questionSet){
  const shuffledQuestions = shuffleArray(questionSet);
  return shuffledQuestions.map(orig => {
    const tagged = orig.options.map((opt, idx) => ({ opt, idx }));
    const shuffledOptions = shuffleArray(tagged);
    const newCorrect = shuffledOptions.findIndex(o => o.idx === orig.correct);
    return {
      q: orig.q,
      options: shuffledOptions.map(o => o.opt),
      correct: newCorrect,
      exp: orig.exp,
      materia: orig.materia
    };
  });
}

function isValidWhatsapp(v){
  const digits = v.replace(/\D/g,'');
  return digits.length >= 10 && digits.length <= 13;
}

function onlyDigits(v){
  return v.replace(/\D/g,'');
}

async function saveLead(nome, sobrenome, whatsapp){
  if(!CONFIG.SUPABASE_URL || CONFIG.SUPABASE_URL.indexOf('COLOQUE_AQUI') !== -1){
    console.warn('Supabase não configurado ainda — lead não foi persistido. Preencha CONFIG no topo do arquivo.');
    return;
  }
  const whatsappDigits = onlyDigits(whatsapp);
  try{
    const checkUrl = `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.SUPABASE_TABLE}?whatsapp=eq.${encodeURIComponent(whatsappDigits)}&select=id`;
    const checkResp = await fetch(checkUrl, {
      headers: {
        'apikey': CONFIG.SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`
      }
    });
    const existing = await checkResp.json();
    if(Array.isArray(existing) && existing.length > 0){
      console.log('WhatsApp já cadastrado — não duplicando o lead na tabela.');
      return;
    }
    await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.SUPABASE_TABLE}`, {
      method: 'POST',
      headers: {
        'apikey': CONFIG.SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ nome, sobrenome, whatsapp: whatsappDigits })
    });
  }catch(err){
    console.error('Falha ao salvar lead no Supabase:', err);
  }
}

  try{
    await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.SUPABASE_TABLE}?whatsapp=eq.${encodeURIComponent(whatsappDigits)}`, {

window.submitLead = function(){
  const nome = document.getElementById('inp-nome').value.trim();
  const sobrenome = document.getElementById('inp-sobrenome').value.trim();
  const whatsapp = document.getElementById('inp-whatsapp').value.trim();

  let ok = true;
  toggleError('err-nome', nome.length < 2); if(nome.length < 2) ok = false;
  toggleError('err-sobrenome', sobrenome.length < 2); if(sobrenome.length < 2) ok = false;
  const waValid = isValidWhatsapp(whatsapp);
  toggleError('err-whatsapp', !waValid); if(!waValid) ok = false;

  if(!ok) return;

  state.nome = nome; state.sobrenome = sobrenome; state.whatsapp = whatsapp;
  saveLead(nome, sobrenome, whatsapp);
  state.screen = 'menu';
  state.showUnlockModal = true;
  render();
};

  QUIZ = buildShuffledQuiz(SIMULADOS[state.simulado].questions);
  state.screen = 'quiz';
  state.current = 0; state.score = 0; state.selected = null; state.answered = false;
  state.rating = 0; state.ratingSubmitted = false;
  state.byMateria = {};
  render();
};

window.selectOption = function(idx){
  if(state.answered) return;
  state.selected = idx;
  state.answered = true;
  const mat = QUIZ[state.current].materia || SIMULADOS[state.simulado].badge;
  if(!state.byMateria[mat]) state.byMateria[mat] = { total: 0, acertos: 0 };
  state.byMateria[mat].total++;
  if(idx === QUIZ[state.current].correct){
    state.score++;
    state.byMateria[mat].acertos++;
  }
  render();
};

window.nextQuestion = function(){
  if(state.current < QUIZ.length - 1){
    state.current++;
    state.selected = null;
    state.answered = false;
    render();
  } else {
    state.screen = 'result';
    render();
  }
};

window.restartQuiz = function(){
  window.startQuiz();
};

  const commentHtml = state.answered
    ? `<div class="comment-box"><b>Comentário:</b> ${q.exp}</div>`
    : '';

  const nextLabel = state.current === QUIZ.length - 1 ? 'Ver resultado' : 'Próxima questão';

  return `
    <div class="card">
      ${stampHtml}
      <div class="progress-row">
        <span class="mono-label pnum">Questão ${state.current + 1} / ${QUIZ.length}</span>
        <span class="mono-label" style="color:var(--bone-dim); font-size:11px;">${escapeHtml(badgeText)}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      ${optionsHtml}
      ${commentHtml}
      ${state.answered ? `<button class="btn btn-primary" onclick="nextQuestion()">${nextLabel}</button>` : ''}
    </div>
  `;
}

function ratingBlock(){
  if(state.ratingSubmitted){
    return `<p class="lead" style="text-align:center;">Valeu pela avaliação! ⭐ ${state.rating}/5</p>`;
  }
  const stars = [1,2,3,4,5].map(n => {
    const filled = n <= state.rating;
    return `<button class="star-btn ${filled ? 'filled' : ''}" onclick="rateMaterial(${n})" aria-label="${n} estrela${n>1?'s':''}">★</button>`;
  }).join('');
  return `<div class="star-row">${stars}</div>`;
}

function screenResult(){
  const total = QUIZ.length;
  const pct = Math.round((state.score/total)*100);
  let msg;
  if(pct >= 80) msg = "Nível de aprovado. Continue nesse ritmo!";
  else if(pct >= 50) msg = "Bom começo — revise os comentários e repita os pontos que errou.";
  else msg = "Todo início tem ajuste de rota. Releia os comentários e refaça o simulado.";

  const materias = Object.keys(state.byMateria);
  const breakdownHtml = materias.length > 1 ? `
      <div class="divider"></div>
      <p class="eyebrow">Desempenho por matéria</p>
      <div class="breakdown">
        ${materias.map(mat => {
          const d = state.byMateria[mat];
          const p = Math.round((d.acertos/d.total)*100);
          return `
            <div class="breakdown-row">
              <span style="min-width:110px;">${escapeHtml(mat)}</span>
              <div class="breakdown-bar"><div class="breakdown-fill" style="width:${p}%"></div></div>
              <b>${d.acertos}/${d.total}</b>
            </div>
          `;
        }).join('')}
      </div>
  ` : '';

  return `
    <div class="card">
      <p class="eyebrow">Resultado</p>
      <h1 class="title">Simulado concluído</h1>
      <div class="score-wrap">
        <div class="score-ring">
          <div class="big">${state.score}/${total}</div>
          <div class="small">Acertos</div>
        </div>
      </div>
      <p class="lead" style="text-align:center;">${msg}</p>
      ${breakdownHtml}

      <div class="divider"></div>

      <p class="eyebrow">Avalie este material</p>
      ${ratingBlock()}

      <div class="divider"></div>

      <p class="eyebrow">Gostou do material?</p>
      <p class="lead">Ajude o projeto a crescer: entre no nosso grupo gratuito, tire um print deste resultado e nos marque no Instagram para apoiar a comunidade.</p>

      <a class="btn btn-whatsapp" href="${CONFIG.WHATSAPP_LINK}" target="_blank" rel="noopener noreferrer">Ainda não entrou no nosso grupo? Entre e fique por dentro de mais materiais como esse</a>

      <div class="insta-row">
        <span>📸</span>
        <span>Marque a gente no Instagram: <span class="handle">${CONFIG.INSTAGRAM_HANDLE}</span></span>
      </div>

      <button class="btn btn-ghost" style="margin-top:14px;" onclick="restartQuiz()">Refazer este dia</button>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="backToMenu()">Escolher outro dia</button>
    </div>
  `;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
